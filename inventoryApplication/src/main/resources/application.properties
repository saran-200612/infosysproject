spring.application.name=inventoryApplication

server.port=${PORT:9191}
server.forward-headers-strategy=framework

# Production-safe database configuration.
# Local defaults keep the existing project easy to run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventorydb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# Frontend origin used by the global CORS configuration.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3131}

# Session cookie settings. For HTTPS cross-site deployment use:
# SESSION_COOKIE_SAMESITE=None
# SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
