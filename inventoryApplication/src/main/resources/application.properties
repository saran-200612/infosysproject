spring.application.name=inventoryApplication

server.port=${PORT:9191}
server.forward-headers-strategy=framework

# PostgreSQL configuration. Render Blueprint supplies DB_HOST, DB_PORT,
# DB_NAME, DB_USERNAME, and DB_PASSWORD from the managed database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventorydb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3131}

server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
